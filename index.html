<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAVORA - متجر عالي الجودة في الجزائر</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0f3822;
            --secondary: #d4af37;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --white: #ffffff;
            --gray: #e9ecef;
            --danger: #dc3545;
            --success: #28a745;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        /* شاشة إعدادات Supabase الأولى */
        #setup-screen {
            max-width: 500px; margin: 40px auto; background: var(--white); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #setup-screen h2 { color: var(--primary); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
        }
        .btn {
            background-color: var(--primary); color: var(--white); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background-color: #6c757d; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }

        /* الهيدر */
        header { background: var(--primary); color: var(--white); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: bold; color: var(--secondary); text-decoration: none; }
        .nav-links button { background: none; border: 1px solid var(--secondary); color: var(--secondary); padding: 5px 12px; border-radius: 5px; cursor: pointer; }

        /* البنر الرئيسي */
        .hero { background: linear-gradient(rgba(15,56,34,0.9), rgba(15,56,34,0.9)), url('') center/cover; color: var(--white); text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 26px; margin-bottom: 10px; color: var(--secondary); }
        .hero p { font-size: 14px; margin-bottom: 20px; }

        /* المحتوى العام */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        
        /* البحث والفلاتر */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters input, .filters select { flex: 1; min-width: 140px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }

        /* شبكة المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 15px; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .old-price { text-decoration: line-through; color: #999; font-size: 12px; margin-right: 5px; }

        /* صفحة تفاصيل المنتج ونموذج الطلب */
        .section-view { display: none; background: var(--white); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .active-section { display: block; }

        /* لوحة التحكم */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--gray); padding-bottom: 10px; overflow-x: auto; }
        .admin-tab-btn { background: none; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; white-space: nowrap; }
        .admin-tab-btn.active { background: var(--primary); color: var(--white); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid var(--gray); padding: 10px; text-align: right; }
        th { background-color: var(--primary); color: var(--white); }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-new { background: #17a2b8; color: white; }
        .badge-confirmed { background: var(--success); color: white; }
        .badge-cancelled { background: var(--danger); color: white; }

        footer { text-align: center; padding: 20px; background: #222; color: #aaa; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <!-- شاشة إدخال بيانات Supabase إذا لم تكن مخزنة -->
    <div id="setup-screen" style="display:none;">
        <h2>إعدادات اتصال Supabase</h2>
        <p style="margin-bottom: 15px; font-size: 13px; color: #666;">لكي يعمل المتجر وحفظ الطلبات بشكل حقيقي أدخل بيانات مشروعك في Supabase:</p>
        <div class="form-group">
            <label>Supabase URL</label>
            <input type="text" id="sb-url" placeholder="https://xyz.supabase.co">
        </div>
        <div class="form-group">
            <label>Supabase Anon/Publishable Key</label>
            <input type="text" id="sb-key" placeholder="eyJhbGciOi...">
        </div>
        <button class="btn" onclick="saveConfig()">حفظ ومتابعة</button>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-content" style="display:none;">
        <header>
            <a href="#" class="logo" id="store-logo-text">ZAVORA</a>
            <div class="nav-links">
                <button onclick="showSection('store-home')">الرئيسية</button>
                <button onclick="checkAdminAccess()">لوحة الإدارة</button>
            </div>
        </header>

        <div style="background: #e2f0d9; color: #274e13; text-align: center; padding: 8px; font-size: 13px;">
